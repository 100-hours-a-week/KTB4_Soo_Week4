spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ktb_project?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:ktb_app}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 1s
      repositories:
        enabled: false
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: never

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 3600          # 1시간
  refresh-token-validity-in-seconds: 1209600      # 14일
